<?xml version="1.0" encoding="utf-8"?>
<!-- Emblème stylisé des Nations unies (globe azimutal + branches d'olivier),
     rendu en « bleu ONU » et utilisé pour attribuer la source des données
     (UN Comtrade). Représentation simplifiée, pas la reproduction officielle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img"
     aria-label="Emblème des Nations unies">
  <g fill="none" stroke="#5B92E5" stroke-width="2.2" stroke-linecap="round">
    <!-- Globe : projection azimutale (parallèles concentriques) -->
    <circle cx="100" cy="90" r="52"/>
    <circle cx="100" cy="90" r="39"/>
    <circle cx="100" cy="90" r="26"/>
    <circle cx="100" cy="90" r="13"/>
    <!-- Méridiens : rayons tous les 30° -->
    <line x1="100" y1="38" x2="100" y2="142"/>
    <line x1="48"  y1="90" x2="152" y2="90"/>
    <line x1="63.9" y1="53.9" x2="136.1" y2="126.1"/>
    <line x1="136.1" y1="53.9" x2="63.9" y2="126.1"/>
    <line x1="74"  y1="43.9" x2="126" y2="136.1"/>
    <line x1="126" y1="43.9" x2="74"  y2="136.1"/>
    <line x1="56.1" y1="64" x2="143.9" y2="116"/>
    <line x1="143.9" y1="64" x2="56.1" y2="116"/>
  </g>
  <!-- Deux branches d'olivier encerclant le globe -->
  <g fill="#5B92E5" stroke="none">
    <g>
      <path d="M91.6 149.4 A60 60 0 0 1 68.2 39.1" fill="none" stroke="#5B92E5" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="91.1" cy="153.4" rx="9" ry="3.5" transform="rotate(98 91.1 153.4)"/>
      <ellipse cx="70.0" cy="146.5" rx="9" ry="3.5" transform="rotate(118 70.0 146.5)"/>
      <ellipse cx="52.4" cy="132.8" rx="9" ry="3.5" transform="rotate(138 52.4 132.8)"/>
      <ellipse cx="40.7" cy="114.0" rx="9" ry="3.5" transform="rotate(158 40.7 114.0)"/>
      <ellipse cx="36.0" cy="92.2" rx="9" ry="3.5" transform="rotate(178 36.0 92.2)"/>
      <ellipse cx="39.1" cy="70.2" rx="9" ry="3.5" transform="rotate(198 39.1 70.2)"/>
      <ellipse cx="49.6" cy="50.6" rx="9" ry="3.5" transform="rotate(218 49.6 50.6)"/>
      <ellipse cx="66.1" cy="35.7" rx="9" ry="3.5" transform="rotate(238 66.1 35.7)"/>
    </g>
    <g transform="translate(200 0) scale(-1 1)">
      <path d="M91.6 149.4 A60 60 0 0 1 68.2 39.1" fill="none" stroke="#5B92E5" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="91.1" cy="153.4" rx="9" ry="3.5" transform="rotate(98 91.1 153.4)"/>
      <ellipse cx="70.0" cy="146.5" rx="9" ry="3.5" transform="rotate(118 70.0 146.5)"/>
      <ellipse cx="52.4" cy="132.8" rx="9" ry="3.5" transform="rotate(138 52.4 132.8)"/>
      <ellipse cx="40.7" cy="114.0" rx="9" ry="3.5" transform="rotate(158 40.7 114.0)"/>
      <ellipse cx="36.0" cy="92.2" rx="9" ry="3.5" transform="rotate(178 36.0 92.2)"/>
      <ellipse cx="39.1" cy="70.2" rx="9" ry="3.5" transform="rotate(198 39.1 70.2)"/>
      <ellipse cx="49.6" cy="50.6" rx="9" ry="3.5" transform="rotate(218 49.6 50.6)"/>
      <ellipse cx="66.1" cy="35.7" rx="9" ry="3.5" transform="rotate(238 66.1 35.7)"/>
    </g>
